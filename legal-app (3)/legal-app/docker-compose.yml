services:
  db:
    image: pgvector/pgvector:pg16
    environment: {POSTGRES_USER: legal, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}", POSTGRES_DB: legal}
    volumes: [pgdata:/var/lib/postgresql/data]
  api:
    build: .
    env_file: .env
    environment: {DATABASE_URL: "postgresql+psycopg2://legal:${POSTGRES_PASSWORD}@db:5432/legal"}
    ports: ["127.0.0.1:8000:8000"]
    depends_on: [db]
volumes: {pgdata: {}}
